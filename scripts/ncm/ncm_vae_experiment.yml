# General settings
debug: False
compile: false
load_from_checkpoint: False
checkpoint_file: "model_epoch_850.pt"
exp_name: "causalmnist_ncm_vae_exp1"   # NF-specific experiment name

system:
  device: "cuda"
  accelerator: "cuda"
  seed: 5678

data:
  model_dir: "CausalMNIST/ncm/"
  batch_size: 32 #512
  num_workers: 3 # 24
  img_size: 32
  graph_type: "chain"
  val_split: 0.1

optimizer:
  lr: 0.0003
  betas: [0.9, 0.95]
  weight_decay: 0.0001
  gan_mode: 'wgan'

training:
  max_epochs: 2000
  grad_accum_steps: 2
  save_every: 10
  n_log_steps: 10
  grad_clip: 1.0
  use_amp: True

model:
  num_flows: 64
  trainable_edges: True

scheduler:
  type: "cosine"
  lr_min: 6e-5

vae:
  experiment_name: "causalmnist_exp2_betamax005"   # Identifier for linking to the VAE config
  # checkpoint_dir: "/local/eb/adam2392/CausalMNIST/vae_reduction/"
  checkpoint_dir: "/Users/adam2392/pytorch_data/CausalMNIST/vae_reduction/"
  latent_dim: 32
  vae_checkpoint_fname: "final_model.pt"
