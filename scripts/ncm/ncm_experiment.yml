# General settings
debug: False
compile: false
load_from_checkpoint: False
checkpoint_file: "model_epoch_850.pt"
exp_name: "causalmnist_ncm_exp1"   # NF-specific experiment name

system:
  device: "cuda"
  accelerator: "cuda"
  seed: 5678

data:
  model_dir: "CausalMNIST/ncm/"
  batch_size: 2048
  num_workers: 24
  img_size: 32
  graph_type: "chain"
  val_split: 0.1

optimizer:
  gen_lr: 0.0002
  disc_lr: 0.0001
  betas: [0.9, 0.95]
  weight_decay: 0.0001
  gan_mode: 'wgan'


training:
  max_epochs: 50
  grad_accum_steps: 1
  save_every: 10
  n_log_steps: 10
  grad_clip: 1.0
  use_amp: False

model:
  K: 32
  latent_dim: 
  h_layers: 3
  h_size: 64

scheduler:
  type: "cosine"
  lr_min: 6e-5
